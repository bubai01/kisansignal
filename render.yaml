services:
  - type: web
    name: kisansignal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - {key: DATABASE_URL, sync: false}
      - {key: TRUST_PROXY, value: "1"}
      - {key: SECRET, generateValue: true}
      - {key: ADMIN_TOKEN, generateValue: true}
      - {key: SMS_PROVIDER, value: twilio}
      - {key: TWILIO_SID, sync: false}
      - {key: TWILIO_TOKEN, sync: false}
      - {key: TWILIO_FROM, sync: false}
      - {key: ANTHROPIC_API_KEY, sync: false}
